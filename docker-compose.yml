services:
  postgres:
    image: postgres:16-alpine
    container_name: personcrud-postgres
    environment:
      POSTGRES_DB: persondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persondb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  person-crud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personcrud-backend
    # Restrict direct host access to local loopback (127.0.0.1).
    # Remote clients must access via Nginx reverse proxy on port 3000 to enforce security headers.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/persondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/persons"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: personcrud-frontend
    ports:
      - "3000:80"
    depends_on:
      person-crud:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: personcrud_net
